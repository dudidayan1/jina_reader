{{- if .Values.serp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jina-reader.componentFullname" (list . "serp") }}
  labels:
    {{- include "jina-reader.componentLabels" (list . "serp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    {{- include "jina-reader.componentSelectorLabels" (list . "serp") | nindent 4 }}
{{- end }}
